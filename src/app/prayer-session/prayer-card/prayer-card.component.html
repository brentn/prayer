<div class="card">
    <div class="card-header" *ngIf="listName">
        <span class="list-name">{{ listName }}</span>
    </div>
    <app-prayer-card-content [title]="title" [topicId]="topicId" (requestAnswered)="requestAnswered.emit($event)"
        (requestArchived)="requestArchived.emit($event)" (requestTitleEdited)="requestTitleEdited.emit($event)"
        (requestAnswerAdd)="requestAnswerAdd.emit($event)">
    </app-prayer-card-content>
    <div class="card-footer" *ngIf="listName">
        <div class="new-request-button">
            <button mat-icon-button (click)="onNewRequest()">
                <mat-icon>add</mat-icon>
            </button>
        </div>
    </div>
    @if (showDialog()) {
        <div class="dialog-overlay" (click)="closeDialog()">
            <div class="dialog-content" (click)="$event.stopPropagation()">
                <div class="dialog-header">
                    <h2>New Prayer Request</h2>
                </div>
                <p>Topic: {{ title }}</p>
                <textarea [(ngModel)]="newRequestText" placeholder="Enter your prayer request..." rows="4"
                    style="width: 100%;"></textarea>
                <div class="dialog-actions">
                    <button mat-button style="color: grey;" (click)="closeDialog()">Cancel</button>
                    <button mat-flat-button style="background-color: var(--theme-accent); color: white;"
                        (click)="onSave()">Save</button>
                </div>
            </div>
        </div>
    }
</div>
